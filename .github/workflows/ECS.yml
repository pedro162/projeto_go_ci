name: Continous Delivery

on:
  workflow_call:

jobs:
  ECS:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest"]
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2
        
    - name: Getting task definition
      run: aws ecs describe-task-definition --task-definition Task_API-GO --query taskDefinition > task-definition.json
    
    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: GO
        image: pedro0000/go_ci:${{github.run_number}}
        environment-variables: |
            HOST=${{ secrets.DB_HOST }}
            USER=${{ secrets.DB_USER }}
            PASSWORD=${{ secrets.DB_PASSWORD }}
            DBNAME=${{ secrets.DB_DBNAME }}
            DB_PORT=${{ secrets.DB_PORT }}
            PORT=8000

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: Servico_API-GO
        cluster: API-TEST-GO
        wait-for-service-stability: true
